  <desc>Vector recreation of the supplied ccdM download logo, traced with OpenCV and refined as SVG geometry.</desc>
  <defs>
    <radialGradient id="bgGradient" cx="52%" cy="45%" r="78%">
      <stop offset="0%" stop-color="#06112e"/>
      <stop offset="72%" stop-color="#040f27"/>
      <stop offset="100%" stop-color="#020a20"/>
    </radialGradient>

    <linearGradient id="blueGradient" x1="20%" y1="8%" x2="86%" y2="92%">
