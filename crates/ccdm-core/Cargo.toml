[package]
name = "ccdm-core"
version = "0.9.0"
edition = "2021"
description = "Core download engine for ccdwonloadmanager (Rust port of XDM concepts)"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = "0.4"
dirs = "7.0.0"
futures = "0.3.34"
reqwest = { version = "0.13.4", features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tempfile = "3"
